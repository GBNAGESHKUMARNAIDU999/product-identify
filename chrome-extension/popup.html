<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; color: #1e293b; }
      h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
      h1 img { width: 20px; height: 20px; }
      label { font-size: 11px; color: #64748b; display: block; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; margin-bottom: 10px; }
      .saved { color: #059669; font-size: 11px; height: 14px; margin: -6px 0 8px; }
      button { width: 100%; padding: 7px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; margin-bottom: 6px; }
      button.ghost { background: #eef2ff; color: #4f46e5; }
      .hint { font-size: 10.5px; color: #94a3b8; line-height: 1.4; margin-top: 8px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .dot.ok { background: #10b981; } .dot.bad { background: #f43f5e; }
    </style>
  </head>
  <body>
    <h1><img src="icons/icon48.png" alt="" /> InventoryLens</h1>
    <label for="server">InventoryLens server URL</label>
    <input id="server" type="url" placeholder="http://localhost:3000" />
    <div class="saved" id="saved"></div>
    <button id="results">View last result</button>
    <button id="app" class="ghost">Open InventoryLens app</button>
    <p class="hint">
      Right-click any product image on any website and choose <b>“Identify with InventoryLens”</b>.
      The photo is matched against your imported catalog with confidence scoring.
    </p>
    <p class="hint" id="serverState"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
