<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>InventoryLens — result</title>
    <style>
      :root { --accent: #4f46e5; }
      * { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; color: #1e293b; }
      .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
      h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
      h1 img { width: 28px; height: 28px; }
      .sub { color: #64748b; font-size: 13px; margin-bottom: 20px; }
      .banner { border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
      .banner.ok { background: #ecfdf5; color: #065f46; }
      .banner.warn { background: #fffbeb; color: #92400e; }
      .banner.err { background: #fef2f2; color: #991b1b; }
      .banner b { display: block; margin-bottom: 2px; }
      .banner small { opacity: .8; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
      @media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }
      .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; }
      .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #64748b; margin-bottom: 8px; }
      img.photo { width: 100%; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; max-height: 340px; object-fit: contain; }
      .name { font-weight: 600; font-size: 14px; margin-top: 10px; }
      .sku { color: #64748b; font-size: 12px; }
      .pct { float: right; font-size: 12px; color: #475569; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
      td { border-top: 1px solid #e2e8f0; padding: 5px 8px; vertical-align: top; }
      td.k { color: #64748b; width: 40%; }
      .cands { margin-top: 22px; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
      .cand { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; }
      .cand img { width: 100%; border-radius: 8px; border: 1px solid #e2e8f0; background: #fff; max-height: 170px; object-fit: contain; }
      .rank { font-size: 10px; background: #f1f5f9; border-radius: 999px; padding: 2px 8px; color: #475569; }
      .foot { color: #94a3b8; font-size: 11px; margin-top: 18px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1><img src="icons/icon48.png" alt="" /> InventoryLens result</h1>
      <div class="sub" id="meta">…</div>
      <div id="content"></div>
    </div>
    <script type="module" src="results.js"></script>
  </body>
</html>
